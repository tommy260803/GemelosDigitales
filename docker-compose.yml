version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: maternal_health_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maternal_twin_db}
      POSTGRES_USER: ${POSTGRES_USER:-twin_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_twin_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - twin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twin_admin} -d ${POSTGRES_DB:-maternal_twin_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: maternal_health_cache
    ports:
      - "6379:6379"
    networks:
      - twin-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maternal_health_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-twin_admin}:${POSTGRES_PASSWORD:-secure_twin_password_2026}@postgres:5432/${POSTGRES_DB:-maternal_twin_db}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - twin-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: maternal_health_web
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_started
    networks:
      - twin-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:

networks:
  twin-network:
    driver: bridge
